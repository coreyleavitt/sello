name: merge-gate

# RFC-005 slice 1: minimal CI build path (unit-linux-amd64-gcc). Slice 2
# adds property-linux-amd64-gcc (milpa-in-CI) and check-readme; later
# slices keep widening this one workflow, never forking a second one for
# required checks (Part B, "The build-path invariant").
#
# Trigger: every push on every branch except the orphan `evidence` branch
# (RFC-005 Part B — evidence publications have no source tree and would
# burn a guaranteed-red battery). No path filters: required checks are
# unconditional (a filtered-out required check never reports and blocks
# the push).
on:
  push:
    branches-ignore:
      - evidence

# Workflow-level least-privilege permissions (RFC-005 Part B, "CI supply
# chain"): this workflow only needs to read the repository.
permissions:
  contents: read

# Per-branch concurrency, cancel superseded runs -- only the branch head
# ever needs to go green in the fast-forward merge model (RFC-005 Part B).
concurrency:
  group: merge-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Check name is a stable public interface (RFC-005 Part B) -- do not
  # rename without the documented two-step (add new, retire old, manifest
  # + ruleset regenerated in the same commit pair, once the gates manifest
  # exists).
  unit-linux-amd64-gcc:
    name: unit-linux-amd64-gcc
    runs-on: ubuntu-latest
    # Pinned by digest, not tag (RFC-005 Part B: a mutable tag is "trust
    # our transcripts" one layer down). Resolved from tag `2.2.10` via
    # `podman image inspect ghcr.io/coreyleavitt/nim:2.2.10 --format
    # '{{.Digest}}'` on 2026-08-24. Re-pin (new digest comment + this
    # comment's date) whenever the tag moves; slice 7 consolidates image
    # pins into a committed pin file.
    container:
      image: ghcr.io/coreyleavitt/nim@sha256:cd4708fb29d16ec4256a0bdcf8a4873b1f5a7a7200e32890ed52d5893227e780
    steps:
      # actions/checkout v5, pinned by full commit SHA (RFC-005 Part B:
      # every third-party action pinned by commit SHA). Resolved via
      # `gh api repos/actions/checkout/git/ref/tags/v5` on 2026-08-24.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # Exactly one scripts/ invocation (RFC-005 Part B, "build-path
      # invariant"): ci-setup.sh writes the zero-dependency nim.cfg (no
      # milpa needed for the core suite), then test.sh runs in-container
      # mode (SELLO_IN_CONTAINER=1 -- we are already inside the pinned
      # image, so test.sh skips its own podman wrapper and host preflight).
      - run: scripts/ci-setup.sh && SELLO_IN_CONTAINER=1 scripts/test.sh

  # RFC-005 slice 8: the clang-backend leg of unit-linux-amd64-gcc above --
  # same suite, same digest-pinned image (clang/clang22 is already present
  # in this base image per slice 7's verification: `which clang`/`rpm -qa
  # | grep clang` both confirmed, so no separate sello-dev image is
  # needed here), compiled with `--cc:clang` instead of the gcc default
  # via scripts/test.sh's `--cc <name>` mechanism (that script's own
  # header comment has the full design). The first test file's compile is
  # additionally routed through scripts/lib/toolchain-canary.sh, which
  # asserts from Nim's own `--listCmd` output that clang was actually
  # invoked -- not merely that the flag was accepted (RFC-005 Part B's
  # matrix-leg platform-identity canary requirement); the gcc job above
  # gets the identical canary for free, since scripts/test.sh always runs
  # it regardless of --cc.
  unit-linux-amd64-clang:
    name: unit-linux-amd64-clang
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/coreyleavitt/nim@sha256:cd4708fb29d16ec4256a0bdcf8a4873b1f5a7a7200e32890ed52d5893227e780
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: scripts/ci-setup.sh && SELLO_IN_CONTAINER=1 scripts/test.sh --cc clang

  # RFC-005 slice 2 (milpa-in-CI): the property suites need the optional
  # proptest dependency, which only milpa can fetch -- this job builds
  # milpa from the pinned commit (scripts/lib/milpa-pin.txt) inside the
  # same pinned image, fetches proptest under `--locked` (asserts the
  # fetch matches the committed milpa.lock -- identity + provenance, the
  # replacement for `milpa verify`, which milpa 0.0.1 cannot run against a
  # non-default feature selection), and asserts the proptest SKIPPED
  # banner is ABSENT from the run log (a silent skip here must be a red
  # check, not a quietly weaker suite -- RFC-005 Part B). See
  # scripts/ci-property.sh's own header comment for the full mechanics.
  property-linux-amd64-gcc:
    name: property-linux-amd64-gcc
    runs-on: ubuntu-latest
    # Same digest pin as unit-linux-amd64-gcc above -- one image, one pin
    # comment to keep current (slice 7 consolidates image pins into a
    # committed pin file).
    container:
      image: ghcr.io/coreyleavitt/nim@sha256:cd4708fb29d16ec4256a0bdcf8a4873b1f5a7a7200e32890ed52d5893227e780
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: SELLO_IN_CONTAINER=1 scripts/ci-property.sh

  # RFC-005 slice 8: the clang-backend leg of property-linux-amd64-gcc
  # above -- scripts/ci-property.sh forwards --cc clang straight through
  # to scripts/test.sh (that script's own header comment has the
  # mechanics), so the property suites compile and run under clang too,
  # with the identical proptest-skip-banner-absent assertion and
  # toolchain canary as their gcc sibling.
  property-linux-amd64-clang:
    name: property-linux-amd64-clang
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/coreyleavitt/nim@sha256:cd4708fb29d16ec4256a0bdcf8a4873b1f5a7a7200e32890ed52d5893227e780
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: SELLO_IN_CONTAINER=1 scripts/ci-property.sh --cc clang

  # RFC-005 slice 2: check-readme.sh retrofitted with the same
  # SELLO_IN_CONTAINER split as scripts/test.sh (it used to hardcode
  # podman and skip the host milpa preflight -- see that script's header
  # comment). README fences only exercise `import sello`, so this job
  # needs ci-setup.sh's zero-dependency nim.cfg, not milpa.
  check-readme:
    name: check-readme
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/coreyleavitt/nim@sha256:cd4708fb29d16ec4256a0bdcf8a4873b1f5a7a7200e32890ed52d5893227e780
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: scripts/ci-setup.sh && SELLO_IN_CONTAINER=1 scripts/check-readme.sh

  # RFC-005 slice 3: the gates-manifest-sync drift check -- asserts this
  # workflow's job name set equals scripts/lib/gates.txt's check-name
  # set, in both directions (scripts/gates-manifest-check.sh's own header
  # comment has the full parse-method and self-reference writeup). Pure
  # text scan over two committed files, no Nim/podman/milpa needed -- runs
  # on a plain runner rather than the digest-pinned container (RFC-005
  # Part B's container rule targets BUILD jobs; this job builds nothing).
  # Still exactly one scripts/ invocation (the build-path invariant holds
  # regardless of container vs. plain runner).
  gates-manifest-sync:
    name: gates-manifest-sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: scripts/gates-manifest-check.sh

  # RFC-005 slice 4: the ruleset-sync drift check -- asserts the full
  # canonicalized live GitHub ruleset state (.github/rulesets/*.json)
  # equals what's committed, plus two name-equality legs (main ruleset
  # required checks vs. scripts/lib/gates.txt, and gates.txt vs. this
  # workflow's own job names). See scripts/ruleset-sync-check.sh's own
  # header for the full mechanics, including the waiver register
  # (scripts/lib/waivers.txt) and why live ruleset reads work
  # unauthenticated on this public repo (this job still passes
  # GITHUB_TOKEN for the higher authenticated rate limit, not because
  # reads require it). `fetch-depth: 0` (full history, not the default
  # shallow clone) so a SHA-form waiver expiry can be checked via local
  # `git merge-base --is-ancestor` against this small repo's full history.
  # Pure text/API scan, no Nim/podman/milpa needed -- plain runner, same
  # rationale as gates-manifest-sync above. Still exactly one scripts/
  # invocation.
  ruleset-sync:
    name: ruleset-sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - run: scripts/ruleset-sync-check.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # RFC-005 slice 4: the policy-lint check -- actionlint (self-fetched
  # and checksum-verified inside the script, pinned version -- see
  # scripts/policy-lint.sh's own header for why it isn't a Marketplace
  # action) plus four content assertions over every
  # .github/workflows/*.yml: every `uses:` SHA-pinned, no
  # continue-on-error on any (required) job, a top-level permissions:
  # block present, and container: image digests matching
  # scripts/lib/image-pins.txt. Pure text scan plus one network fetch
  # (the actionlint binary) -- plain runner, same rationale as
  # gates-manifest-sync/ruleset-sync above. Still exactly one scripts/
  # invocation.
  policy-lint:
    name: policy-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: scripts/policy-lint.sh
