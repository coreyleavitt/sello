name: merge-gate

# RFC-005 slice 1: minimal CI build path (unit-linux-amd64-gcc). Slice 2
# adds property-linux-amd64-gcc (milpa-in-CI) and check-readme; later
# slices keep widening this one workflow, never forking a second one for
# required checks (Part B, "The build-path invariant").
#
# Trigger: every push on every branch except the orphan `evidence` branch
# (RFC-005 Part B — evidence publications have no source tree and would
# burn a guaranteed-red battery). No path filters: required checks are
# unconditional (a filtered-out required check never reports and blocks
# the push).
on:
  push:
    branches-ignore:
      - evidence

# Workflow-level least-privilege permissions (RFC-005 Part B, "CI supply
# chain"): this workflow only needs to read the repository.
permissions:
  contents: read

# Per-branch concurrency, cancel superseded runs -- only the branch head
# ever needs to go green in the fast-forward merge model (RFC-005 Part B).
concurrency:
  group: merge-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # RFC-005 slice 18: the API-surface gate (A8). Regenerates
  # tests/api/api_surface_gen.py's facade-surface dump (a `nim
  # jsondoc`-driven, deterministic pass over src/sello.nim's own `export`
  # statements -- see that Python module's own doc comment for the full
  # verify-first-spike writeup: mechanism chosen and its recorded blind
  # spots) and diffs it against the committed baseline at
  # tests/api-surface/expected/plain.txt via scripts/lib/baseline.sh (the
  # shared regenerable-baseline idiom, landed in THIS slice rather than
  # slice 17 as Part B originally assigned -- slice 17 remains blocked on
  # the same Corey-owned ghcr credential as slices 10/14/15, so this
  # slice, needing only the base image, lands the shared library first;
  # see CLAUDE.md's own placement-swap note). Same digest-pinned image as
  # every other amd64 build job -- no milpa/proptest needed (the
  # generator only needs `nim jsondoc` and python3, both already in the
  # base image), same "zero-dependency" category as check-readme below.
  api-surface:
    name: api-surface
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/coreyleavitt/nim@sha256:cd4708fb29d16ec4256a0bdcf8a4873b1f5a7a7200e32890ed52d5893227e780
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: SELLO_IN_CONTAINER=1 scripts/api-surface-check.sh plain

  # RFC-005 slice 18: the `-d:selloLibsodium` config leg of api-surface
  # above -- the facade legitimately WIDENS under this define
  # (SodiumInitError, widened {.raises.} on the sign/keygen path), so this
  # gate pins a SEPARATE baseline
  # (tests/api-surface/expected/selloLibsodium.txt) rather than reusing
  # the plain one, per RFC-005 Part B's own "the surface is build-config
  # -dependent" correction -- the delta between the two baselines is
  # itself a pinned, reviewed fact (see CLAUDE.md's A8 entry for the
  # exact delta recorded this slice: SodiumInitError plus widened raises
  # only, nothing else). Runs on the SAME base image as every other job
  # here, with no libsodium-devel installed at all -- verified empirically
  # during this slice's spike that `nim jsondoc -d:selloLibsodium` never
  # needs the real libsodium headers/library (it is a Nim-semantic-pass
  # -only tool; FFI `{.importc, header.}` declarations resolve as plain
  # name bindings, with no C compile/link step), so this leg needed no
  # sello-dev image and landed alongside its plain sibling in the same
  # slice rather than waiting on the Corey-owned ghcr credential fork
  # blocking slices 10/14/15/17.
  api-surface-libsodium:
    name: api-surface-libsodium
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/coreyleavitt/nim@sha256:cd4708fb29d16ec4256a0bdcf8a4873b1f5a7a7200e32890ed52d5893227e780
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: SELLO_IN_CONTAINER=1 scripts/api-surface-check.sh selloLibsodium

  # Check name is a stable public interface (RFC-005 Part B) -- do not
  # rename without the documented two-step (add new, retire old, manifest
  # + ruleset regenerated in the same commit pair, once the gates manifest
  # exists).
  unit-linux-amd64-gcc:
    name: unit-linux-amd64-gcc
    runs-on: ubuntu-latest
    # Pinned by digest, not tag (RFC-005 Part B: a mutable tag is "trust
    # our transcripts" one layer down). Resolved from tag `2.2.10` via
    # `podman image inspect ghcr.io/coreyleavitt/nim:2.2.10 --format
    # '{{.Digest}}'` on 2026-08-24. Re-pin (new digest comment + this
    # comment's date) whenever the tag moves; slice 7 consolidates image
    # pins into a committed pin file.
    container:
      image: ghcr.io/coreyleavitt/nim@sha256:cd4708fb29d16ec4256a0bdcf8a4873b1f5a7a7200e32890ed52d5893227e780
    steps:
      # actions/checkout v5, pinned by full commit SHA (RFC-005 Part B:
      # every third-party action pinned by commit SHA). Resolved via
      # `gh api repos/actions/checkout/git/ref/tags/v5` on 2026-08-24.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # Exactly one scripts/ invocation (RFC-005 Part B, "build-path
      # invariant"): ci-setup.sh writes the zero-dependency nim.cfg (no
      # milpa needed for the core suite), then test.sh runs in-container
      # mode (SELLO_IN_CONTAINER=1 -- we are already inside the pinned
      # image, so test.sh skips its own podman wrapper and host preflight).
      - run: scripts/ci-setup.sh && SELLO_IN_CONTAINER=1 scripts/test.sh

  # RFC-005 slice 8: the clang-backend leg of unit-linux-amd64-gcc above --
  # same suite, same digest-pinned image (clang/clang22 is already present
  # in this base image per slice 7's verification: `which clang`/`rpm -qa
  # | grep clang` both confirmed, so no separate sello-dev image is
  # needed here), compiled with `--cc:clang` instead of the gcc default
  # via scripts/test.sh's `--cc <name>` mechanism (that script's own
  # header comment has the full design). The first test file's compile is
  # additionally routed through scripts/lib/toolchain-canary.sh, which
  # asserts from Nim's own `--listCmd` output that clang was actually
  # invoked -- not merely that the flag was accepted (RFC-005 Part B's
  # matrix-leg platform-identity canary requirement); the gcc job above
  # gets the identical canary for free, since scripts/test.sh always runs
  # it regardless of --cc.
  unit-linux-amd64-clang:
    name: unit-linux-amd64-clang
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/coreyleavitt/nim@sha256:cd4708fb29d16ec4256a0bdcf8a4873b1f5a7a7200e32890ed52d5893227e780
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: scripts/ci-setup.sh && SELLO_IN_CONTAINER=1 scripts/test.sh --cc clang

  # RFC-005 slice 9: the ASan/UBSan leg -- same suite, same digest-pinned
  # image (no sello-dev needed: this leg needs only gcc plus its bundled
  # libasan/libubsan runtime, already part of the base image's gcc
  # toolchain -- same "already present, verify rather than assume" posture
  # slice 7/8 established for clang), compiled with
  # `-fsanitize=address,undefined -fno-sanitize-recover=all` via
  # scripts/test.sh's `--sanitize asan-ubsan` mechanism (that script's own
  # header comment has the full design, including why `-d:useMalloc` is
  # required alongside it for Nim's ORC allocator, and why LeakSanitizer is
  # disabled for this leg specifically). Unit suite only, per RFC-005 Part
  # B's merge-gate paragraph ("ASan/UBSan build of the unit suite") -- no
  # property sibling. The first test file's compile is additionally routed
  # through scripts/lib/sanitizer-canary.sh, which asserts from Nim's own
  # `--listCmd` output that BOTH gcc was actually invoked AND the
  # `-fsanitize=` flags genuinely reached that compile line -- not merely
  # that scripts/test.sh accepted `--sanitize` (RFC-005 Part B's matrix-leg
  # platform-identity canary requirement).
  unit-linux-amd64-gcc-asan-ubsan:
    name: unit-linux-amd64-gcc-asan-ubsan
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/coreyleavitt/nim@sha256:cd4708fb29d16ec4256a0bdcf8a4873b1f5a7a7200e32890ed52d5893227e780
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: scripts/ci-setup.sh && SELLO_IN_CONTAINER=1 scripts/test.sh --sanitize asan-ubsan

  # RFC-005 slice 11: the linux/arm64 leg of unit-linux-amd64-gcc above.
  # No `container:` field -- slice 7's manifest query found the pinned
  # ghcr.io/coreyleavitt/nim image has no arm64 variant (linux/amd64 and
  # windows/amd64 only), and growing one is out of scope for this repo
  # (the image's build source lives in a separate, undocumented-here
  # repo). The recorded decision is a direct, checksum-pinned Nim
  # toolchain install on the hosted `ubuntu-24.04-arm` runner instead of a
  # multi-arch image build (scripts/ci-nim-setup.sh's own header has the
  # full pin story: nim-lang/nightlies, the official Nim project's own
  # release repo, pinned to the exact source commit the `2.2.10` tag
  # resolves to, checksum-verified before extraction). That script's
  # `--expect-arch aarch64` argument IS this leg's platform-identity
  # canary (RFC-005 Part B's matrix-leg rule) -- it asserts `uname -m`
  # before installing anything, so a mislabeled/reverted runner image
  # fails loud rather than silently running the wrong architecture.
  # scripts/test.sh's own toolchain-canary.sh call still runs
  # unconditionally underneath (gcc, unchanged), so this leg also proves
  # the C compiler identity for free, same as every other leg.
  # SELLO_IN_CONTAINER=1 is hardcoded here (not left to scripts/test.sh's
  # own dual-mode host branch) because there is no podman wrapping to
  # skip in the first place on this runner -- "in-container mode" (run
  # the commands directly, no host milpa preflight) is simply the only
  # mode this leg ever has.
  unit-linux-arm64-gcc:
    name: unit-linux-arm64-gcc
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: scripts/ci-nim-setup.sh --expect-arch aarch64
      - run: scripts/ci-setup.sh && SELLO_IN_CONTAINER=1 scripts/test.sh

  # RFC-005 slice 2 (milpa-in-CI): the property suites need the optional
  # proptest dependency, which only milpa can fetch -- this job builds
  # milpa from the pinned commit (scripts/lib/milpa-pin.txt) inside the
  # same pinned image, fetches proptest under `--locked` (asserts the
  # fetch matches the committed milpa.lock -- identity + provenance, the
  # replacement for `milpa verify`, which milpa 0.0.1 cannot run against a
  # non-default feature selection), and asserts the proptest SKIPPED
  # banner is ABSENT from the run log (a silent skip here must be a red
  # check, not a quietly weaker suite -- RFC-005 Part B). See
  # scripts/ci-property.sh's own header comment for the full mechanics.
  property-linux-amd64-gcc:
    name: property-linux-amd64-gcc
    runs-on: ubuntu-latest
    # Same digest pin as unit-linux-amd64-gcc above -- one image, one pin
    # comment to keep current (slice 7 consolidates image pins into a
    # committed pin file).
    container:
      image: ghcr.io/coreyleavitt/nim@sha256:cd4708fb29d16ec4256a0bdcf8a4873b1f5a7a7200e32890ed52d5893227e780
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: SELLO_IN_CONTAINER=1 scripts/ci-property.sh

  # RFC-005 slice 8: the clang-backend leg of property-linux-amd64-gcc
  # above -- scripts/ci-property.sh forwards --cc clang straight through
  # to scripts/test.sh (that script's own header comment has the
  # mechanics), so the property suites compile and run under clang too,
  # with the identical proptest-skip-banner-absent assertion and
  # toolchain canary as their gcc sibling.
  property-linux-amd64-clang:
    name: property-linux-amd64-clang
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/coreyleavitt/nim@sha256:cd4708fb29d16ec4256a0bdcf8a4873b1f5a7a7200e32890ed52d5893227e780
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: SELLO_IN_CONTAINER=1 scripts/ci-property.sh --cc clang

  # RFC-005 slice 11: the linux/arm64 leg of property-linux-amd64-gcc
  # above. Same no-container, direct-install rationale as
  # unit-linux-arm64-gcc above (see that job's own comment) --
  # scripts/ci-property.sh needs no changes of its own: it already builds
  # milpa from a pinned commit into an isolated venv via python3+pip
  # (present on GitHub-hosted ubuntu-24.04-arm the same as on
  # ubuntu-latest) and forwards straight through to scripts/test.sh, which
  # picks up the toolchain scripts/ci-nim-setup.sh just installed via the
  # $HOME/.sello-nim/current on-disk convention (scripts/test.sh's own
  # header). Same proptest-skip-banner-ABSENT assertion as every other
  # property leg.
  property-linux-arm64-gcc:
    name: property-linux-arm64-gcc
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: scripts/ci-nim-setup.sh --expect-arch aarch64
      - run: SELLO_IN_CONTAINER=1 scripts/ci-property.sh

  # RFC-005 slice 12: the macOS-arm64 leg. Unit suite ONLY, per Part B's
  # merge-gate paragraph ("macOS-arm64 ... unit suite (proptest-skip loud
  # and asserted)") -- there is no property-macos-arm64 sibling: this
  # runner has no milpa/proptest story of its own (no network-installed
  # Python venv chain has been built for it, and nothing in the RFC calls
  # for one), so the property suites are EXPECTED to self-skip loud, not
  # run for real.
  #
  # No `container:` field -- macOS runners have no digest-pinnable
  # container image at all (unlike linux/arm64, which at least has the
  # option in principle; slice 7's manifest query never found one here
  # either since none exists). Same direct-install pattern as the
  # linux/arm64 legs above: scripts/ci-nim-setup.sh installs a
  # checksum-pinned Nim toolchain (scripts/lib/nim-pin.txt's
  # `darwin-arm64` row, from the SAME nim-lang/nightlies release/source
  # commit as every other pinned row -- that script's own header has the
  # full provenance writeup) onto the $HOME/.sello-nim/current path
  # scripts/test.sh already knows to pick up. `--expect-arch arm64`, NOT
  # `aarch64` -- this is the platform-identity canary (RFC-005 Part B's
  # matrix-leg rule), and Darwin's `uname -m` reports `arm64`, a
  # genuinely different string from Linux's `aarch64` for the identical
  # physical architecture (verified, not assumed: `scripts/ci-nim-setup.sh`
  # asserts this BEFORE installing anything, so a mismatched runner image
  # fails loud rather than silently installing the wrong tarball).
  #
  # `runs-on: macos-15` -- the current (non-deprecated, as of this slice)
  # GitHub-hosted Apple-silicon (arm64) macOS runner label; recorded here
  # explicitly since, unlike the Linux legs, there is no separate image
  # digest pin to carry the "which exact image" story instead.
  #
  # `--cc clang`: macOS ships no real `gcc` (Apple's Xcode Command Line
  # Tools alias `/usr/bin/gcc` to Apple clang under the hood, which would
  # make scripts/test.sh's default `gcc`-named toolchain canary pass on a
  # technicality while printing a `gcc`-named --listCmd line that isn't
  # upstream GCC at all) -- passing `--cc clang` explicitly makes Nim
  # invoke, and scripts/lib/toolchain-canary.sh assert, the `clang`
  # compiler-config section by name, matching this job's own check name
  # and giving an honest identity match instead of a same-binary
  # coincidence. scripts/lib/toolchain-canary.sh's slice-12 addition also
  # echoes the observed `clang --version` line into the job log, so the
  # actual Apple clang version this run compiled under is on record, per
  # this leg's own DoD ("pin story = runner label + Nim pin + observed
  # Apple clang version recorded").
  #
  # `--expect-proptest-skip`: this leg's own proptest-skip assertion,
  # inverted from every property-* job's own (which assert the banner is
  # ABSENT) -- this leg has no proptest fetch story, so the banner's
  # PRESENCE is the correct, expected outcome, and its absence (or the
  # property suites somehow running for real) must go red here
  # (scripts/test.sh's own header comment has the full mechanism).
  unit-macos-arm64-clang:
    name: unit-macos-arm64-clang
    runs-on: macos-15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: scripts/ci-nim-setup.sh --expect-arch arm64
      - run: scripts/ci-setup.sh && SELLO_IN_CONTAINER=1 scripts/test.sh --cc clang --expect-proptest-skip

  # RFC-005 slice 13: the Windows/MinGW-gcc leg, the last hosted-native
  # matrix leg. Unit suite ONLY, no property sibling -- same rationale as
  # unit-macos-arm64-clang above (no milpa/proptest fetch story on this
  # runner). `runs-on: windows-2025` -- the current, non-deprecated
  # GitHub-hosted Windows runner label, recorded explicitly here since,
  # like macOS, there is no separate image digest to carry that story
  # instead.
  #
  # `defaults: run: shell: bash` -- Part B's Windows execution model is
  # explicit ("run steps use shell: bash (Git Bash); the scripts ARE the
  # entry point -- no PowerShell snowflake"): every run step below is Git
  # Bash, not the runner's own PowerShell default, so the exact same
  # scripts/ invocations every other leg uses run here too, unmodified.
  #
  # No `container:` field -- Windows runners have no digest-pinnable
  # container image at all (same category as macOS). Nim's own Windows
  # toolchain zip ships NO C compiler (verified directly against the real
  # asset -- no gcc/mingw entry anywhere in its file list --
  # scripts/lib/nim-pin.txt's own comment on the `windows-x86_64` row has
  # the full writeup), and the RFC's own text flags that the
  # RUNNER-BUNDLED MinGW a Windows image ships out of the box drifts
  # silently -- so both toolchains are installed from this project's own
  # checksum-verified pins rather than trusting whatever the runner image
  # happens to carry: `scripts/ci-nim-setup.sh --with-mingw` (that
  # script's own header has the full pin/install-convention writeup for
  # both scripts/lib/nim-pin.txt's `windows-x86_64` row and the sibling
  # scripts/lib/mingw-pin.txt).
  #
  # Naming: `unit-windows-amd64-gcc`, matching the existing job-naming
  # axis across this whole matrix (the job name encodes the C COMPILER --
  # `unit-linux-amd64-gcc`/`-clang`, `unit-linux-arm64-gcc`,
  # `unit-macos-arm64-clang` -- not the distribution channel a compiler
  # happened to be fetched from), not `unit-windows-amd64-mingw`.
  #
  # Identity canary, two parts (RFC-005 Part B's matrix-leg rule, and this
  # leg's own scoping problem: Git Bash's `uname -m` on 64-bit Windows
  # reports `x86_64` -- the SAME string a plain Linux amd64 host reports
  # for the same physical architecture, unlike the aarch64-vs-arm64
  # Linux/Darwin split every earlier leg relied on -- so arch alone cannot
  # tell this runner apart from an ordinary Linux dev workstation):
  #   1. `--expect-arch x86_64` -- the existing arch canary, asserted the
  #      same as every leg.
  #   2. `--expect-os 'MINGW64_NT*|MSYS*'` -- a NEW, slice-13-only OS-
  #      identity canary asserted against the RAW `uname -s` value (which
  #      Git Bash reports as `MINGW64_NT-<kernel-build>`), closing the
  #      exact gap arch alone leaves open. scripts/ci-nim-setup.sh's own
  #      header comment has the full mechanism.
  # Plus the toolchain-version canary `--with-mingw` runs internally
  # (asserts the installed `gcc --version` output contains the PINNED
  # version from scripts/lib/mingw-pin.txt, not merely that some gcc-named
  # binary landed on PATH) and scripts/test.sh's own
  # scripts/lib/toolchain-canary.sh call, which still runs unconditionally
  # underneath (gcc, the default `--cc`), proving Nim actually invoked it,
  # for free, exactly like every other leg.
  #
  # `--expect-proptest-skip`: this leg's own proptest-skip assertion (the
  # exact inverse of every property-* job's own "banner ABSENT"
  # assertion), same as unit-macos-arm64-clang above -- this runner has no
  # milpa/proptest fetch story of its own, so the banner's PRESENCE is the
  # correct, expected outcome.
  unit-windows-amd64-gcc:
    name: unit-windows-amd64-gcc
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: scripts/ci-nim-setup.sh --expect-arch x86_64 --expect-os 'MINGW64_NT*|MSYS*' --with-mingw
      - run: scripts/ci-setup.sh && SELLO_IN_CONTAINER=1 scripts/test.sh --expect-proptest-skip

  # RFC-005 slice 2: check-readme.sh retrofitted with the same
  # SELLO_IN_CONTAINER split as scripts/test.sh (it used to hardcode
  # podman and skip the host milpa preflight -- see that script's header
  # comment). README fences only exercise `import sello`, so this job
  # needs ci-setup.sh's zero-dependency nim.cfg, not milpa.
  check-readme:
    name: check-readme
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/coreyleavitt/nim@sha256:cd4708fb29d16ec4256a0bdcf8a4873b1f5a7a7200e32890ed52d5893227e780
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: scripts/ci-setup.sh && SELLO_IN_CONTAINER=1 scripts/check-readme.sh

  # RFC-005 slice 3: the gates-manifest-sync drift check -- asserts this
  # workflow's job name set equals scripts/lib/gates.txt's check-name
  # set, in both directions (scripts/gates-manifest-check.sh's own header
  # comment has the full parse-method and self-reference writeup). Pure
  # text scan over two committed files, no Nim/podman/milpa needed -- runs
  # on a plain runner rather than the digest-pinned container (RFC-005
  # Part B's container rule targets BUILD jobs; this job builds nothing).
  # Still exactly one scripts/ invocation (the build-path invariant holds
  # regardless of container vs. plain runner).
  gates-manifest-sync:
    name: gates-manifest-sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: scripts/gates-manifest-check.sh

  # RFC-005 slice 4: the ruleset-sync drift check -- asserts the full
  # canonicalized live GitHub ruleset state (.github/rulesets/*.json)
  # equals what's committed, plus two name-equality legs (main ruleset
  # required checks vs. scripts/lib/gates.txt, and gates.txt vs. this
  # workflow's own job names). See scripts/ruleset-sync-check.sh's own
  # header for the full mechanics, including the waiver register
  # (scripts/lib/waivers.txt) and why live ruleset reads work
  # unauthenticated on this public repo (this job still passes
  # GITHUB_TOKEN for the higher authenticated rate limit, not because
  # reads require it). `fetch-depth: 0` (full history, not the default
  # shallow clone) so a SHA-form waiver expiry can be checked via local
  # `git merge-base --is-ancestor` against this small repo's full history.
  # Pure text/API scan, no Nim/podman/milpa needed -- plain runner, same
  # rationale as gates-manifest-sync above. Still exactly one scripts/
  # invocation.
  ruleset-sync:
    name: ruleset-sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - run: scripts/ruleset-sync-check.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # RFC-005 slice 4: the policy-lint check -- actionlint (self-fetched
  # and checksum-verified inside the script, pinned version -- see
  # scripts/policy-lint.sh's own header for why it isn't a Marketplace
  # action) plus four content assertions over every
  # .github/workflows/*.yml: every `uses:` SHA-pinned, no
  # continue-on-error on any (required) job, a top-level permissions:
  # block present, and container: image digests matching
  # scripts/lib/image-pins.txt. Pure text scan plus one network fetch
  # (the actionlint binary) -- plain runner, same rationale as
  # gates-manifest-sync/ruleset-sync above. Still exactly one scripts/
  # invocation.
  policy-lint:
    name: policy-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: scripts/policy-lint.sh

  # RFC-005 slice 16 (build-smoke check; taken out of order -- slices
  # 10/14/15 remain blocked on a Corey-owned ghcr write:packages
  # credential for the sello-dev image push, but this leg needs only the
  # always-available base image, so it was pulled forward rather than
  # blocking on that credential). Compiles the fuzz external target with
  # its real SanitizerCoverage instrumentation plus its plain driver
  # (scripts/fuzz.sh --build-only), runs ONE deterministic known-valid
  # input directly through the built target binary (not the proptest
  # mutation campaign -- see scripts/fuzz.sh's --build-only header for
  # why), and compiles (never runs) tests/ct/ct_main.nim
  # (scripts/ct.sh --build-only) -- three harnesses under tests/fuzz/ and
  # tests/ct/ that would otherwise first compile at a maintainer's manual
  # invocation or a future nightly, discovered broken only then (RFC-005
  # Part B, round-2 finding A5). ct_main is COMPILED ONLY here, never run
  # for a timing verdict -- scripts/build-smoke.sh's own run log states
  # this explicitly and unmissably (RFC-005 Part B: "hosted CI runs the
  # dudect harness in compile-smoke mode only... stated in the workflow
  # name" -- satisfied in spirit via the loud log statement rather than a
  # job-name qualifier, since this one job's name already covers the fuzz
  # target/driver too, not ct_main alone). SCOPE, stated honestly: the
  # taint (slice 19) and disasm (slice 23) binaries do not exist in this
  # repository yet and are therefore NOT covered by this job -- those
  # slices extend this exact script/job in place when they land, per the
  # RFC's own phased sequencing (see scripts/build-smoke.sh's own header
  # comment for the full writeup). Same digest-pinned image as every
  # other amd64 build job; needs milpa+proptest (the fuzz driver imports
  # proptest, unlike ct_main), so its one run step needs no `ci-setup.sh`
  # chain -- scripts/build-smoke.sh's own in-container body does its own
  # milpa install + `--features proptest --locked` fetch, mirroring
  # property-linux-amd64-gcc's run step shape exactly.
  build-smoke:
    name: build-smoke
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/coreyleavitt/nim@sha256:cd4708fb29d16ec4256a0bdcf8a4873b1f5a7a7200e32890ed52d5893227e780
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: SELLO_IN_CONTAINER=1 scripts/build-smoke.sh

  # RFC-005 slice 31 (README evidence table + drift check): parses
  # README.md's validation-map table (every CLAUDE.md "validation bar"
  # claim, mapped to its enforcing mechanism, per RFC-005 Part B's
  # evidence-story paragraph and its round-2 corrections (i)-(iii)) and
  # asserts each row's declared mechanism is real -- a required-check
  # row's job exists in this workflow AND scripts/lib/gates.txt, a
  # nightly row's job exists in nightly.yml, a manual-ritual row's
  # freshness canary is a real committed file, a committed "pending slice
  # N" allowlist entry, or an explicit "none (by design)". Also checks
  # the badge-URL branch pin, the toolchain-canary workflow's deliberate
  # lack of a badge, the platform-support claim's named CI legs, and the
  # CT compiler-scope claim's gcc/clang versions and image digest against
  # scripts/lib/image-pins.txt's committed record. Pure text scan over
  # committed files -- no Nim/podman/milpa needed -- so this runs on a
  # plain `ubuntu-latest` runner, no `container:`, same rationale as
  # gates-manifest-sync/ruleset-sync/policy-lint above. Still exactly one
  # scripts/ invocation.
  validation-map:
    name: validation-map
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: scripts/validation-map-check.sh
