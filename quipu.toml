# quipu v1 (tool source: ~/projects/quipu; hub instance: quipu.leavitt.dev).
# The documents themselves are the ledgers (+++ TOML front matter). sello's
# docs live flat under docs/ as rfc-NNN-slug.md; handoffs and companions
# match the glob too but carry no fence, so they are not documents.

[record]
globs = ["docs/rfc-*.md"]

# RFC 0004 fork debt-cap, proceeding on its recorded lean (K=3, per-repo);
# the fork stays open for ratification.
[roadmap]
review_cap = 3
